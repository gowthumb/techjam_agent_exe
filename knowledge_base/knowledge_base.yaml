# Knowledge Base — KuaiRand-Pure / long_view within-user ranking
#
# A directive for the autonomous agent: what to try next, in what range, how to
# tell if it is going wrong, and when to stop pushing an axis.
#
# Every empirical entry carries an `evidence` block naming the exp_ids in
# ../ml_modelling/experiments.jsonl that produced it. `ml_modelling/tools/kb_check.py`
# (run from the repo root) verifies each cited run exists and that `calibration`
# matches the organizers' file. Prose here is written to be acted on, not admired:
# if an entry does not change what the agent does, it does not belong.
#
# THIS FILE IS THE ONE THE AGENT PARSES. See README.md for how to consume it and
# INTEGRATION_CONTRACT.md for when in the loop each section is read.

meta:
  schema_version: 3
  dataset: kuairand_pure
  scope: >-
    VALUES IN THIS FILE ARE VALID FOR KUAIRAND-PURE ONLY. Measured against
    KuaiRand-1K, the headline recommendation loses by -0.0152. The METHOD
    (decision_protocol, control_rule, diagnostics) travels; the numbers do not.
    See scale_transfer before using this on any other benchmark.
  task: within-user ranking of logged impressions
  label: long_view
  metric: mean(GAUC, nDCG@5)
  derived_from: ../ml_modelling/experiments.jsonl   # the lab that produced this KB
  rationale_doc: knowledge_base_rationale.md        # phases 0-10 (sibling file)
  rationale_doc_tier12: TIER12_RESULTS.md           # phases 11-17 (sibling file)
  scorer: kuairand-starter-kit/evaluate.py   # never reimplement this
  v3_changes: >-
    Phases 11-17 (TIER12_RESULTS.md): added sampled-softmax as a confirmed
    BPR-peer loss; retired the embedding-noise lead as a bias artifact; added the
    rand_valid bias-overfitting veto (decision_protocol.unbiased_veto); closed
    watch-time regression, ESMM, and duration-regime/freshness features as
    negatives, each with its control.

# ---------------------------------------------------------------- calibration
# The fixed rungs. Judge every score against these, never against 1.0. nDCG@5 is
# capped at 0.729 on test because 27.1% of users have no positive at all.
calibration:
  random:            {valid: 0.4834, test: 0.4753}
  popularity:        {valid: 0.5807, test: 0.5715}
  official_baseline: {valid: 0.6016, test: 0.5946}
  oracle_ceiling:    {valid: 0.8484, test: 0.8645}
  note: >-
    The baseline already holds 30.7% of the reachable interval (random -> oracle).
    Remaining headroom is 0.27 on test, not 0.41. Report progress as a fraction of
    (oracle - random), which harness.headroom_pct computes.
  random_exposure:
    what: >-
      Rungs for the randomly-exposed log (explib/unbiased.py, Phase 11). Label
      rate 0.081 vs 0.31 in biased traffic -- these numbers are NOT comparable to
      the biased rungs above. A bias-overfitting veto, not a score to optimise.
      See decision_protocol.unbiased_veto.
    rand_valid: {random: 0.3120, popularity: 0.3605, oracle: 0.6854}
    rand_test:  {random: 0.3126, popularity: 0.3731, oracle: 0.8138}
    reference_points:
      pointwise_k16:   {rand_valid: 0.3635}
      bpr_k16:         {rand_valid: 0.3749}
      ssm_lr3e-4_t1:   {rand_valid: 0.3736}
    seed_sd_rand_valid: 0.0019

# ------------------------------------------------------------ decision protocol
# The section the reflection step must not skip. Without it the agent will read
# seed noise as progress.
decision_protocol:
  select_on: valid
  test_is: >-
    A stand-in for the hidden set. Record it, never select on it. Every number in
    this KB was chosen on valid.
  measured_noise:
    method: 5 seeds, identical config, baseline FM
    pointwise: {valid_sd: 0.0005, test_sd: 0.0008}
    bpr:       {valid_sd: 0.0006, test_sd: 0.0002}
    evidence:
      exp_ids:
        - 1H-seedstudy-pointwise-seed0
        - 1H-seedstudy-pointwise-seed1
        - 1H-seedstudy-pointwise-seed2
        - 1H-seedstudy-pointwise-seed3
        - 1H-seedstudy-pointwise-seed4
      note: >-
        Valid sd (0.0005) is slightly SMALLER than test sd (0.0008) despite valid
        being the smaller split. The official 0.0008 figure is a safe band for both.
  single_run_band: 0.0016
  single_run_rule: >-
    From ONE run, treat |delta| < 0.0016 as no result. harness.classify applies
    this; do not eyeball it.
  replication_rule: >-
    THE MOST IMPORTANT RULE HERE. The single-run band is far too wide for a
    replicated mean. With n seeds the standard error is sd/sqrt(n) ~ 0.0004 at
    n=5, so a +0.002 effect that reads "neutral" on one run is decisive on five.
    Any config within 0.0015 of the best MUST be re-run on 3+ seeds before it is
    discarded. Doing this is what turned the loss-function axis from "no effect"
    into a confirmed +0.0021.
  replication_cost: >-
    Cheap. A 3-seed replicate of the leading config costs ~3 minutes at k<=8,
    which is a small fraction of one iteration's budget. Budget for it.
  valid_blind_spot: >-
    Several interventions are flat on valid but consistently better on test (BPR:
    +0.0021 valid vs +0.0032 test; sparse auxiliary heads: +0.0010 vs +0.0009).
    Valid is 7 days immediately after train; test is 10 days further out. When
    valid is flat but test moves consistently in one direction across a whole
    sweep, treat it as weak evidence FOR the intervention, not against it — but
    still select on valid.
  unbiased_veto: >-
    From Phase 12 on, every intervention is ALSO scored on rand_valid (the
    randomly-exposed log, explib/unbiased.py). rand_valid is NOT a selection
    metric: it correlates only +0.32 with test across configs, carries ~0.0019
    seed sd, and has distributional quirks (listwise ranks well under random
    exposure, poorly under biased). It IS a veto: an intervention that gains on
    valid but drops >= 0.003 on rand_valid is fitting the exposure policy rather
    than user preference, and is not shipped. This retired embedding_noise
    (+0.0008 valid, -0.0014 to -0.0064 rand_valid). It also independently
    confirmed BPR at 4x the biased-valid effect size (+0.0121 rand_valid).
    evidence:
      exp_ids: [11-pointwise-k16, 11-pointwise-k16-noise0.1, 11-bpr-k16,
                11-bpr-k16-noise0.1, 11-listwise-lr0.001]
  log_schema_rule: >-
    EVERY parameter that varies within an axis must be readable from the exp_id, not
    merely present in the row. A run that is unique but whose id omits the deciding
    parameter still reads as comparable to one it is not — that is how an
    architecture grid got run at 10x the validated learning rate and was nearly
    reported as an architecture result. tools/analyze.py --ids audits this; the
    count is 38 (v2: 23). ~15 of the new flags are the audit's exact-token
    limitation, not genuine unreadability -- e.g. it cannot match config
    `one_sided: False` to the id string "twosided", or `control:
    random_continuous_target` to "randomtarget". The Tier 1/2 exp_ids DO carry
    every deciding parameter in human-readable form (lr, temp, n, k, the loss
    variant), so the phase-7 failure class -- a run that reads as comparable to
    one it is not -- does not recur. The residual real gap: `epochs` (40/45/60)
    and the aux `w_wt` weight are not always in the id. A follow-up rename would
    close it; it does not block any current claim.
  control_rule: >-
    Before crediting an intervention, run the control that isolates it. FOUR
    findings in this KB reversed or evaporated under their control: multi-task (a
    random label matched the real signal), sequences (the no-sequence architecture
    beat the full model), watch-time regression (Phase 13: a random continuous
    target matched the real watch ratio exactly), and duration_regime (Phase 14: a
    shuffled regime field matched the real one). Budget one control run per new
    mechanism; it is cheaper than building on a false positive.

# ------------------------------------------------------- validated search space
# Ranges actually explored, with the boundary values that caused problems.
validated_search_space:
  k:
    validated_range: [1, 16]
    default_start: 6
    verdict: flat_choose_for_cost
    danger_zone: >-
      k >= 32 costs 1.5-3x the runtime for no gain (k=128 takes 188s vs 38s at
      k=8, and scores no better). There is no overfitting cliff — the score is
      simply flat and the compute is wasted.
    rule: >-
      k IS NOT A SCORING KNOB ON THIS DATASET — it is a cost knob. Measured over
      3 seeds per point, the score is flat from k=1 to k=16 under both losses.
      Pick the smallest k that is stable (k=6) to buy iteration speed, and do not
      raise k in response to a plateau: every value above 16 was flat or worse at
      1.5-3x the cost.
    do_not_use_k1: >-
      k=1 scores as well as anything on average but has 4x the seed variance
      (valid sd 0.0021 vs 0.0005 at k=2). A single k=1 run scored 0.6033 and
      looked like a breakthrough; three seeds put it at 0.6023 +/- 0.0021. It is a
      trap for single-run evaluation specifically.
    evidence:
      exp_ids: [1D-pointwise-k8, 1D-pointwise-k16, 1D-pointwise-k32,
                1D-pointwise-k64, 1D-pointwise-k128,
                1K-pointwise-k1-seed0, 1K-pointwise-k1-seed1, 1K-pointwise-k1-seed2,
                1K-pointwise-k2-seed0, 1K-pointwise-k4-seed0, 1K-pointwise-k6-seed0,
                1J-bpr-lr0.0002-k4-ep60-seed0, 1J-bpr-lr0.0002-k6-ep60-seed0,
                1J-bpr-lr0.0002-k8-ep60-seed0]
      note: >-
        3-seed means, valid. pointwise: k1 0.6023+/-0.0021, k2 0.6028+/-0.0005,
        k4 0.6021+/-0.0002, k6 0.6020+/-0.0006, k16 0.6018+/-0.0005 (5 seeds).
        bpr: k4 0.6035, k6 0.6037, k8 0.6037, k16 0.6038 (5 seeds). Flat under
        both losses; the loss is what separates them, not the capacity.
  learning_rate:
    pointwise:
      validated_range: [0.001, 0.001]
      default: 0.001
      danger_zone: ">= 0.1 collapses the model (see diagnostics)"
    bpr:
      validated_range: [0.0001, 0.001]
      default: 0.0002
      danger_zone: ">= 0.005 undoes the entire gain; >= 0.02 costs -0.0043"
      rule: >-
        Ranking losses need a SMALLER lr than logloss, not a larger one. They
        normalize per pair/group rather than per row, so the effective step at a
        given lr is bigger. If a ranking loss peaks at epoch 1-4 and then decays,
        that is a step-size problem, not evidence against the loss.
    listwise:
      validated_range: []
      note: >-
        no lr in [0.0001, 0.02] beats pointwise; see dead_ends. NOTE this is the
        uniform-over-positives LIST softmax, NOT sampled softmax -- see the `ssm`
        block below, which is a different loss and IS a BPR-peer.
    ssm:
      validated_range: [0.0002, 0.0005]
      default: 0.0003
      danger_zone: ">= 0.001 overshoots -- peaks epoch 2-3 then decays (the ranking-loss step-size signature)"
    evidence:
      exp_ids: [1A-bpr-lr0.0001, 1A-bpr-lr0.0002, 1A-bpr-lr0.0005,
                1A-bpr-lr0.001, 1A-bpr-lr0.005, 1A-bpr-lr0.02]
  l2:
    validated_range: [0.0000001, 0.00001]
    default: 0.000001
    danger_zone: >-
      Degradation starts at 1e-4 (-0.0014) and the model breaks at 1e-3 (-0.0179).
      At 1.0 valid falls to 0.5317, below the popularity rung.
    rule: >-
      L2 is not a useful knob here. The score is flat across 1e-7..1e-5 because
      capacity is not what limits this model — and neither is regularisation, for
      the same reason. Leave it at the default and spend the iteration on the loss.
    evidence:
      exp_ids: ["1D-pointwise-k64-l21e-07", "1D-pointwise-k64-l21e-06",
                "1D-pointwise-k64-l21e-05", "1D-pointwise-k64-l20.0001",
                "1D-pointwise-k64-l20.001", 1E-pointwise-l21-ep12]
      note: >-
        Swept at k=64 specifically, to give L2 the best chance of rescuing an
        over-large model. valid: 1e-7 0.6009, 1e-6 0.6008, 1e-5 0.6007,
        1e-4 0.6002, 1e-3 0.5837. It never recovers the k=16 score.
  epochs:
    pointwise: {max: 40, patience: 4, typical_best_epoch: 7}
    bpr: {max: 60, patience: 6, note: "converges more slowly at its lower lr"}
    ssm: {max: 45, patience: 6, typical_best_epoch: 5, note: "converges FASTEST -- peaks epoch 3-7, cheaper per run than bpr"}
  batch_size:
    default: 8192
    note: "not swept; the baseline's value was kept so loss comparisons stay clean"
  ssm_negatives:
    what: "sampled softmax: neg_per_pos negatives sampled per positive from the SAME user"
    neg_per_pos: {validated_range: [4, 8], default: 8, danger_zone: "n=16 lost -0.0018 valid / -0.0018 test -- more negatives is worse"}
    temp: {validated_range: [1.0, 2.0], default: 1.0}
    within_user_is_the_mechanism: >-
      global-negative ssm (sample from all rows) loses -0.0016 test / -0.011
      rand_valid vs same-user ssm; BPR with pairs_per_pos 2-4 gains nothing. The
      edge is the same-user softmax, not the negative count.
    evidence:
      exp_ids: [12-ssm-lr0.0003-t1-n8-k16-seed1, 12-ssm-lr0.0003-t1-n8-k16-seed3,
                12-ssm-lr0.0005-t1-n16-k16, 12-ssm-global-lr0.0005-t2-n4-k8,
                12-bpr-ppp2-lr0.0002-k16, 12-bpr-ppp4-lr0.0002-k16]

# --------------------------------------------------------------------- priors
# Conditional rules. Each one is a pattern that repeated across experiments.
priors:
  - if: "a plateau is reached and the instinct is to add capacity"
    then: "change the loss, not the capacity"
    why: >-
      Capacity is not the bottleneck in either direction. Raising k is flat-to-
      negative at 1.5-3x the cost; lowering it is also flat. The only axis that
      moved the score was the objective -- and it did so TWICE, from two different
      loss families: BPR (+0.0034 test) and sampled softmax (+0.0038 test). Zero
      capacity changes have moved it. Spend the iteration on the loss.
    evidence:
      exp_ids: [1D-pointwise-k64, 1D-pointwise-k128, 1K-pointwise-k2-seed0,
                1J-bpr-lr0.0002-k6-ep60-seed0, 12-ssm-lr0.0003-t1-n8-k16-seed3]

  - if: "a sweep's best value sits at the edge of the grid"
    then: "extend the grid until the peak is INTERIOR before reporting an optimum"
    why: >-
      Twice in this work the answer was outside the first grid. The BPR learning
      rate was swept upward when the optimum was 5x DOWN, which briefly made the
      whole loss axis look dead; and the embedding-noise sweep stopped at 0.05 while
      still rising, missing both the true pointwise peak (0.1) and the cliff just
      past it (-0.0104 by 0.5). An edge value is not an optimum, it is an unfinished
      sweep.
    evidence:
      exp_ids: ["1A-bpr-lr0.02", "1A-bpr-lr0.0002",
                "8-pointwise-noise0.05-seed0", "8-pointwise-noise0.1-seed0",
                "8-pointwise-noise0.5-seed0"]

  - if: "a config's advantage comes from a single run and the config is unusual (very small k, an exotic loss)"
    then: "replicate on 3 seeds before acting on it — extreme configs have larger seed variance"
    why: >-
      k=1 has 4x the seed variance of k=2 and produced a 0.6033 single run that
      looked like a breakthrough; three seeds put it at 0.6023 +/- 0.0021, i.e.
      no better than the baseline. Variance is not constant across the search
      space, so a fixed single-run band under-protects at its edges.
    evidence:
      exp_ids: [1E-pointwise-k1-ep25, 1K-pointwise-k1-seed0,
                1K-pointwise-k1-seed1, 1K-pointwise-k1-seed2]

  - if: "a ranking loss scores worse than pointwise"
    then: "divide the lr by 5 and retry before concluding the loss is wrong"
    why: >-
      BPR at lr=0.02 scores -0.0043; the same loss at lr=0.0002 scores +0.0021.
      The entire verdict flipped on step size alone.
    evidence:
      exp_ids: [1A-bpr-lr0.02, 1A-bpr-lr0.0002]

  - if: "a new feature is proposed that is keyed on the user only"
    then: "reject it without running it"
    why: >-
      Ranking is within-user, so anything constant inside a user cannot change the
      order. It cannot help, by construction. Only user x item-attribute crosses
      can move the metric.

  - if: "a history / target-encoding feature is proposed"
    then: "measure its warm coverage on EVAL rows first, and drop it below ~70%"
    why: >-
      (user, author) affinity looks sensible and is 97% cold-start on test, so it
      is a constant in disguise. Coverage is a one-line check; training on it is
      30-60s wasted.
    evidence:
      exp_ids: [1B-pointwise-aff-user_author+user_music-causal]

  - if: "an intervention improves the score and adds a mechanism (sequence, aux head, new feature block)"
    then: "run the ablated control before recording it as a win"
    why: >-
      Both mechanism-adding axes in this log reversed under control. See
      decision_protocol.control_rule.
    evidence:
      exp_ids: [1I-din-noseq-d16-lr0.003, 1C-aux-random_sparse-w0.3]

  - if: "training rows are reweighted or filtered by recency"
    then: "keep the effective sample large; mild only, or not at all"
    why: >-
      Volume beats recency on this split. Every hard window hurt, monotonically
      with severity (-0.0025 at 10 days, -0.0274 at 3), and only very mild
      exponential weighting (half-life >= 7 days) was even neutral.
    evidence:
      exp_ids: [1G-window-3d, 1G-window-5d, 1G-window-7d, 1G-window-10d,
                1G-recency-tau2, 1G-recency-tau7, 1G-recency-tau14]

# --------------------------------------------------- feature engineering menu
# Ranked by measured effect. The honest headline: no feature transform tried here
# beat the baseline's five fields. Try these only after the loss and capacity
# axes are exhausted.
feature_engineering_menu:
  menu:
  - name: baseline_five_fields
    fields: [user_id, video_id, author_id, tab, dur_bucket]
    effect: "reference"
    priority: keep
    note: "user_id x video_id already carries most of the learnable signal"

  - name: causal_affinity_author
    effect: "+0.0001 valid — inside noise"
    priority: low
    cost: "~35s, plus a vectorized counter pass"
    evidence: {exp_ids: [1B-pointwise-aff-author-causal]}

  - name: causal_affinity_video
    effect: "-0.0004 valid — item popularity is already inside the video_id embedding"
    priority: skip
    evidence: {exp_ids: [1B-pointwise-aff-video-causal]}

  - name: causal_affinity_user_tag
    effect: "-0.0024 valid — the worst of the affinity family"
    priority: skip
    evidence: {exp_ids: [1B-pointwise-aff-user_tag-causal]}

  - name: causal_affinity_stack
    effect: "-0.0007 valid — stacking five affinity features does not rescue them"
    priority: skip
    evidence: {exp_ids: ["1B-pointwise-aff-video+author+user_tab+user_dur+user_tag-causal"]}

  - name: video_statistic_side_table
    effect: "-0.0024 valid inside a GBDT"
    priority: skip
    caveat: >-
      These aggregates span the test period, so they partially encode test-period
      outcomes. They did not help even so, which settles the question — but do not
      resurrect them without re-reading this note.
    evidence: {exp_ids: ["1F-lgbm-lambdarank-base+aff+user+vstat-lv63"]}

  - name: duration_regime
    effect: "neutral — valid lands exactly on the BPR baseline; the SHUFFLED-regime control scores the same"
    priority: skip
    note: >-
      A 0/1 field at the 18000ms long_view boundary (Phase 14). The shuffled
      control matching it means the FM's user_id x dur_bucket cross already
      carries whatever the regime encodes.
    evidence: {exp_ids: [14-bpr-regime-seed1, 14-bpr-regime-seed2, 14-bpr-regime-shuffled]}

  - name: video_age_bucket
    effect: "-0.0055 valid — a clear negative"
    priority: skip
    note: >-
      Days from upload to impression (Phase 14). 100% coverage, but the age
      distribution shifts hard between splits (train median 2d, valid 14d, test
      23d), so the 'old video' buckets are barely trained and their embeddings are
      noise at eval time. Same failure class as the affinity-coverage rule, and
      Phase 1G already established drift is not exploitable the obvious way.
    evidence: {exp_ids: [14-bpr-videoage, 14-bpr-regime+age]}

  - name: dur_buckets_count
    effect: "flat — 20 buckets reproduces 10 exactly"
    priority: skip
    note: "bucket count is a cost knob like k, not a scoring knob"
    evidence: {exp_ids: [14-bpr-durbuckets20]}

  affinity_leakage_contract: >-
    If affinity features are used at all: counters are built from TRAIN labels
    only, eval rows read frozen train counters, and train rows use either causal
    (strictly-earlier) or leave-one-out counts. explib/history.py implements this
    and ships a probe that flips eval labels and asserts the features do not move.
    A version that reads eval labels scores brilliantly offline and collapses on
    the hidden set.

# ------------------------------------------------------------ multi-task menu
multi_task_signals:
  verdict: not_a_productive_axis
  headline: >-
    The apparent gains are regularisation, not transfer. Effect size rises
    monotonically as the auxiliary signal gets SPARSER, and a RANDOM NOISE label
    at a matched 0.1% positive rate scores +0.0010 — statistically the same as
    is_follow (+0.0011). The content of the auxiliary signal is doing no work.
    Phase 13 extends this to CONTINUOUS targets: a watch-time regression head
    (with a CWM-style one-sided censored loss, even though long_view IS a
    threshold on watch time) is neutral on valid/test and -0.005..-0.007 on
    rand_valid, and a RANDOM continuous target matches it exactly. Phase 15
    extends it to ESMM: the multiplicative P(click).P(lv|click) beats pointwise
    (+0.0006 test, and the gate helps vs no-gate) but loses to BPR by -0.0026,
    same as pointwise. The axis is closed -- binary aux, continuous aux, and
    funnel decomposition all fail to beat the loss change.
  measured_against: 1C-control-singletask-learnA   # the correct control
  by_signal:                                       # d_valid / d_test, weight 0.3
    is_follow:        {pos_rate: 0.00101, d_valid: +0.0011, d_test: +0.0017}
    is_comment:       {pos_rate: 0.00257, d_valid: +0.0010, d_test: +0.0016}
    is_hate:          {pos_rate: 0.00042, d_valid: +0.0011, d_test: +0.0011}
    is_forward:       {pos_rate: 0.00100, d_valid: +0.0011, d_test: +0.0011}
    random_sparse:    {pos_rate: 0.00100, d_valid: +0.0010, d_test: +0.0009, is_noise: true}
    is_profile_enter: {pos_rate: 0.02539, d_valid: +0.0010, d_test: +0.0012}
    is_like:          {pos_rate: 0.01868, d_valid: +0.0008, d_test: +0.0012}
    play_complete:    {pos_rate: 0.17343, d_valid: +0.0004, d_test: +0.0008}
    random_dense:     {pos_rate: 0.46276, d_valid: +0.0003, d_test: +0.0001, is_noise: true}
    play_half:        {pos_rate: 0.29771, d_valid: -0.0006, d_test: -0.0000}
    is_click:         {pos_rate: 0.46345, d_valid: -0.0003, d_test: -0.0013}
  harmful: [is_click, play_half]
  harmful_why: >-
    The dense signals are the seesaw case: is_click fires on 46% of rows and
    competes with long_view for the shared embedding rather than regularising it.
  rule: >-
    Do not spend iterations selecting among the 11 auxiliary signals, on a
    watch-time regression head, or on an ESMM funnel. None beats the loss change.
    If a regulariser is wanted, reducing k is cheaper, larger, and honest about
    what it is doing.
  watch_time_regression:                            # Phase 13
    d_valid: "-0.0002 to +0.0006 vs the wtfm single-task baseline -- neutral"
    d_rand_valid: "-0.005 to -0.007 -- bias-veto reject"
    random_target_control: "matches the real watch-ratio head (0.6015 vs 0.6022 valid)"
    censoring: "one-sided == two-sided Huber (only 17% completed plays)"
    rank_by_wt_head: "0.5868 valid, below the popularity rung -- the watch ratio is duration-confounded"
    evidence: {exp_ids: [13-wt-w0-singletask, 13-wt-w1-onesided-ranklv,
                         13-wt-w1-twosided-ranklv, 13-wt-w1-randomtarget-ranklv,
                         13-wt-w0.5-onesided-rankwt]}
  esmm:                                              # Phase 15
    effect: "+0.0006 test over pointwise (funnel is real: P(lv|no-click)=0.003); -0.0026 vs BPR; -0.0017 rand_valid"
    gate_helps: "gated 0.6025 valid vs no-gate control 0.6013 -- the multiplication is doing work, it just caps below BPR"
    evidence: {exp_ids: [15-esmm-w0.3-gate, 15-esmm-w1-gate, 15-esmm-w1-nogate]}
  evidence:
    exp_ids: [1C-control-singletask, 1C-control-singletask-learnA,
              1C-aux-is_follow-w0.3, 1C-aux-is_click-w0.3,
              1C-aux-random_sparse-w0.3, 1C-aux-random_dense-w0.3]

# --------------------------------------------------------- candidate models
# validated: true means WE RAN IT on KuaiRand-Pure and the number is in the log.
# Licenses were checked against source; re-verify at submission time.
candidate_models:
  - name: fm_pointwise
    category: fm_family
    library: starter_kit
    license: n/a
    validated: true
    result: "valid 0.6018 +/- 0.0005 (5 seeds) — the reference"
    cost: "~40s at k=16, single core, numpy only"
    evidence: {exp_ids: [1A-control-pointwise]}

  - name: fm_bpr
    category: fm_family
    library: starter_kit
    license: n/a
    validated: true
    result: "valid 0.6038 +/- 0.0006, test 0.5980 +/- 0.0002 (5 seeds) — RECOMMENDED (safe)"
    cost: "~70s at k=6 / lr 0.0002 / 60 epochs; ~100s at k=16 for the same score"
    recommended: true
    recommended_config: {loss: bpr, lr: 0.0002, k: 6, epochs: 60, patience: 6, l2: 0.000001}
    note: >-
      Still the designated submission (make_submission.py, submission_test.csv).
      fm_ssm below matches it within noise on valid and edges it +0.0004 on test,
      but 'within noise on the selection split' is not a reason to switch the
      final submission -- BPR has the longer track record here.
    metric_decomposition: >-
      The gain is majority GAUC, which is what a pairwise loss should produce: GAUC
      IS within-user pair order, while nDCG@5 only reads the top 5. valid GAUC
      +0.0027 / nDCG@5 +0.0014 (GAUC = 66% of the primary delta); test GAUC +0.0036
      / nDCG@5 +0.0028 (56%). The mechanism matches the theory, not just the score.
    architecture_independent: >-
      Confirmed across four architectures at their own validated learning rates:
      FM +0.0013, AutoInt +0.0013, FFM +0.0004, DeepFM +0.0003 valid. The result is
      a property of the objective, not of the FM.
    evidence:
      exp_ids: [1H-seedstudy-bpr-seed0, 1H-seedstudy-bpr-seed1,
                1J-bpr-lr0.0002-k6-ep60-seed0, 1J-bpr-lr0.0002-k6-ep60-seed1,
                1J-bpr-lr0.0002-k6-ep60-seed2]

  - name: fm_ssm
    category: fm_family
    library: starter_kit + explib/fm.py (loss='ssm')
    license: n/a
    validated: true
    result: >-
      valid 0.6040 +/- 0.0003, test 0.5984 +/- 0.0004 (5 seeds). A CONFIRMED PEER
      of fm_bpr: tied on valid (+0.0002, <1 se), +0.0004 test (~2 se), tied
      rand_valid. Beats pointwise decisively (+0.0038 test over the official
      baseline vs BPR's +0.0034), from a different loss family.
    config: {loss: ssm, lr: 0.0003, temp: 1.0, neg_per_pos: 8, k: 16, epochs: 45, patience: 6}
    cost: "~90s; peaks epoch 3-7 -- cheaper than BPR's 60 epochs"
    use_for: >-
      the ensemble (Phase 16) -- a decorrelated member, different objective than
      BPR. Not a reason to switch the final submission off BPR.
    evidence:
      exp_ids: [12-ssm-lr0.0003-t1-n8-k16-rep-seed0, 12-ssm-lr0.0003-t1-n8-k16-seed1,
                12-ssm-lr0.0003-t1-n8-k16-seed2, 12-ssm-lr0.0003-t1-n8-k16-seed3,
                12-ssm-lr0.0003-t1-n8-k16-seed4]

  - name: fm_listwise
    category: fm_family
    library: starter_kit
    license: n/a
    validated: true
    result: "the uniform-target list softmax is negative at every lr — see dead_ends. NOT the same as fm_ssm."
    evidence: {exp_ids: [1A-listwise-lr0.0001, 1A-listwise-lr0.02]}

  - name: multitask_fm
    category: multi_task
    library: explib/mtfm.py
    license: n/a
    validated: true
    result: "gains reproduce with random labels — see multi_task_signals"
    evidence: {exp_ids: [1C-aux-random_sparse-w0.3]}

  - name: wtfm_watchtime
    category: multi_task
    library: explib/wtfm.py
    license: n/a
    validated: true
    result: "watch-time regression head: neutral on valid, -0.005..-0.007 rand_valid; random target matches it. See multi_task_signals.watch_time_regression."
    evidence: {exp_ids: [13-wt-w1-onesided-ranklv, 13-wt-w1-randomtarget-ranklv]}

  - name: esmm
    category: multi_task
    library: explib/esmm.py
    license: n/a
    validated: true
    result: "multiplicative P(click).P(lv|click): +0.0006 test over pointwise, -0.0026 vs BPR. See multi_task_signals.esmm."
    evidence: {exp_ids: [15-esmm-w0.3-gate, 15-esmm-w1-nogate]}

  - name: din
    category: sequence_aware
    library: torch
    license: bsd-3-clause
    validated: true
    result: >-
      exposure sequence 0.6022 — WORSE than its own no-sequence control (0.6034)
      at 11x the runtime. The train-label-only positive sequence reaches 0.6038,
      the one sequence variant worth replicating.
    cost: "~250s vs 23s for the no-sequence control"
    evidence: {exp_ids: [1I-din-exposure-d16-lr0.003, 1I-din-noseq-d16-lr0.003,
                         1I-din-positive-d16-lr0.003]}

  - name: lightgbm
    category: gbdt
    library: lightgbm
    license: mit
    validated: true
