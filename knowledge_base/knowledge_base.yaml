# ------------------------------------------------------- architecture ladder
# Written as a DE-escalation ladder, because that is what the evidence supports.
architecture_ladder:
  - stage: fm_pointwise_k16
    is: "the official baseline; where the agent starts"
    escalate_if: "always — move to stage 2 immediately, it is strictly better"

  - stage: fm_bpr_OR_fm_ssm
    config: {loss: bpr, lr: 0.0002, k: 6, epochs: 60, patience: 6}
    alt_config: {loss: ssm, lr: 0.0003, temp: 1.0, neg_per_pos: 8, k: 16, epochs: 45, patience: 6}
    is: >-
      the recommended operating point: BPR +0.0021 valid / +0.0032 test over 5
      seeds, k=6 for speed. Sampled softmax (fm.py loss='ssm') is a CONFIRMED PEER
      -- tied on valid, +0.0004 test, tied rand_valid, and cheaper (peaks epoch
      3-7). Use BPR as the single submission; run SSM too when building an
      ensemble (stage 3), since it is a different loss family and decorrelates.
    escalate_if: >-
      plateaued (eps=0.002 / N=3) with > 15 iterations remaining — and then only
      to stage 3, after replicating the current best on 3 seeds

  - stage: tune_within_family
    is: "lr in [0.0001, 0.001], 3 seeds per point; k can be left small"
    escalate_if: "plateaued again with > 10 iterations remaining"
    note: >-
      The productive region is small and cheap to cover exhaustively. lr is the
      only knob here that changes the score; k only changes the clock.

  - stage: ensemble_bpr_ssm_pointwise
    is: >-
      rank-average (within-user percentile) BPR + SSM + pointwise. Phase 6 found
      seed-averaging one family pays ~0; Phase 16 tests whether a cross-OBJECTIVE
      rank ensemble clears the noise band. Cheap -- no new training if the models
      exist. Select the combo on valid, veto on rand_valid.
    escalate_if: "> 20 iterations remain AND stages 2-3 are exhausted"
    result: "see kb_ensemble / TIER12_RESULTS.md Phase 16"

  - stage: din_positive_sequence
    is: >-
      an unexhausted mechanism, weak-evidence: 0.6038 on a single seed, needs
      3-seed replication before it is trusted
    escalate_if: "> 20 iterations remain AND stages 2-4 are exhausted"
    cost_warning: "~250s per run, ~10x the FM; budget accordingly"

  - stage: do_not_go_here
    is: [deepfm, xdeepfm, dcn, larger_k, more_features, watch_time_head, esmm,
         duration_regime, video_age]
    why: >-
      Every capacity-increasing move in this log was flat or negative, and Phases
      13-15 add watch-time regression, ESMM, and duration/freshness features to
      the list -- each neutral-to-negative with its control run. Escalating
      complexity is the default instinct and it is the wrong one on this dataset.

# ---------------------------------------------------------------- diagnostics
# Symptom -> cause -> fix, built from deliberate failure probes.
diagnostics:
  - symptom: "loss is finite but ~10x the healthy value (e.g. 6.9 vs 0.48), valid stuck near 0.54"
    cause: "learning rate far too high"
    fix: "divide lr by 10 and restart; do not wait for it to recover, it will not"
    note: >-
      IMPORTANT CORRECTION: this FM uses Adam, whose update is bounded, so a
      too-high lr does NOT produce NaN. At lr=1.0 (1000x the default) the loss
      stays finite at ~6.9 forever. Watching for NaN will miss this failure
      entirely — watch the loss MAGNITUDE and the valid score against the
      popularity rung instead.
    evidence: {exp_ids: [1E-pointwise-lr1-ep8, 1E-pointwise-lr0.1-ep10]}

  - symptom: "valid score falls below the popularity rung (0.5807)"
    cause: "the model is worse than a non-trained statistic; config is broken, not merely poor"
    fix: "stop the run, revert to the last known-good config, change one thing"
    evidence: {exp_ids: [1E-pointwise-l21-ep12, 1E-pointwise-lr1-ep8]}

  - symptom: "valid peaks at epoch 1-4 then decays monotonically"
    cause: "step size too large for this loss, most often after switching to a ranking loss"
    fix: "divide lr by 5, raise patience to 6, raise max epochs to 60"
    evidence: {exp_ids: [1A-bpr-lr0.001, 1A-bpr-lr0.0002]}

  - symptom: "embeddings collapse; valid ~0.53, below random+popularity midpoint"
    cause: "L2 far too high (order 1.0)"
    fix: "return l2 to 1e-6; it is not a productive knob on this dataset"
    evidence: {exp_ids: [1E-pointwise-l21-ep12]}

  - symptom: "a GBDT early-stops within ~15 boosting rounds"
    cause: >-
      target-encoded features whose train distribution differs from eval — the
      trees split hard on them and generalize worse each round after
    fix: "drop the affinity block, or rebuild it in leave-one-out mode"
    evidence: {exp_ids: ["1F-lgbm-lambdarank-base+aff-lv63"]}

  - symptom: "a new feature changes the score by almost exactly 0"
    cause: "likely constant within user, or cold-start on nearly every eval row"
    fix: "check eval warm coverage; below ~70% the feature is a constant in disguise"
    evidence: {exp_ids: [1B-pointwise-aff-user_author+user_music-causal]}

# ------------------------------------------------------------------ dead ends
# Hard filter. Do not propose these; the iterations are already spent.
dead_ends:
  - what: "listwise softmax loss (uniform-over-positives target over the whole list)"
    result: >-
      negative at every lr from 0.0001 to 0.02 (-0.0014 to -0.0149). NOTE: this is
      NOT sampled softmax -- ssm (1 positive vs a few same-user negatives) is a
      confirmed BPR-peer, see candidate_models.fm_ssm.
    evidence: {exp_ids: [1A-listwise-lr0.0001, 1A-listwise-lr0.0005,
                         1A-listwise-lr0.005, 1A-listwise-lr0.02]}

  - what: "watch-time regression head (explib/wtfm.py), one-sided or two-sided Huber"
    result: >-
      neutral on valid (== the wtfm single-task baseline), -0.005..-0.007 on
      rand_valid. A RANDOM continuous target matches it exactly; two-sided ==
      one-sided (only 17% completed plays). Ranking by the wt head scores 0.5868,
      below popularity -- the watch ratio is duration-confounded and long_view
      already thresholds it. Phase 13.
    evidence: {exp_ids: [13-wt-w1-onesided-ranklv, 13-wt-w1-twosided-ranklv,
                         13-wt-w1-randomtarget-ranklv, 13-wt-w0.5-onesided-rankwt]}

  - what: "ESMM / multiplicative P(click).P(long_view|click) (explib/esmm.py)"
    result: >-
      +0.0006 test over pointwise (the gate does work -- no-gate control is
      -0.0012 below it), but -0.0026 vs BPR, same as pointwise. Calibration
      objectives lose to ranking objectives on this within-user metric. Phase 15.
    evidence: {exp_ids: [15-esmm-w0.3-gate, 15-esmm-w1-gate, 15-esmm-w1-nogate]}

  - what: "duration_regime field (0/1 at the 18000ms long_view boundary)"
    result: "neutral -- the SHUFFLED-regime control scores the same on valid/test. Phase 14."
    evidence: {exp_ids: [14-bpr-regime-seed1, 14-bpr-regime-shuffled]}

  - what: "video_age_bucket (days from upload to impression)"
    result: >-
      -0.0055 valid. The age distribution shifts train median 2d -> test median
      23d, so the eval-time buckets are barely trained. Phase 14.
    evidence: {exp_ids: [14-bpr-videoage, 14-bpr-regime+age]}

  - what: "sampled softmax with GLOBAL negatives, or BPR with pairs_per_pos > 1"
    result: >-
      global-negative ssm: -0.0016 test / -0.011 rand_valid vs same-user ssm.
      bpr ppp 2-4: flat-to-negative. More negatives / non-within-user negatives
      do not help. Phase 12.
    evidence: {exp_ids: [12-ssm-global-lr0.0005-t2-n4-k8, 12-bpr-ppp2-lr0.0002-k16,
                         12-bpr-ppp4-lr0.0002-k16, 12-ssm-lr0.0005-t1-n16-k16]}

  - what: "hybrid pointwise+listwise"
    result: "-0.0018 at lam=1.0, -0.0024 at lam=0.3; inherits listwise's problem"
    evidence: {exp_ids: [1A-hybrid-lam1, 1A-hybrid-lam0.3]}

  - what: "increasing k above 16"
    result: "flat to -0.0008, at 1.5-3x the runtime"
    evidence: {exp_ids: [1D-pointwise-k32, 1D-pointwise-k64, 1D-pointwise-k128]}

  - what: "adding static side features (organizers' own result, reproduced in spirit here)"
    result: "organizers measured 0.5940 vs 0.5950 for all 13 CWM fields; our affinity variants agree"
    evidence: {exp_ids: ["1B-pointwise-aff-video+author+user_tab+user_dur+user_tag-causal"]}

  - what: "hard recency windows on the training set"
    result: "-0.0025 (10d) through -0.0274 (3d), monotone in severity"
    evidence: {exp_ids: [1G-window-3d, 1G-window-10d]}

  - what: "GBDTs (LightGBM), any feature block combination tried"
    result: "best 0.6001, below the 0.6016 baseline"
    evidence: {exp_ids: ["1F-lgbm-binary-base+aff-lv63"]}

  - what: "selecting among auxiliary multi-task signals"
    result: "gains reproduce with random labels; the signal content does nothing"
    evidence: {exp_ids: [1C-aux-random_sparse-w0.3]}

  - what: "any architecture beyond plain FM (FFM, DeepFM, AutoInt)"
    result: >-
      None beats FM under BPR at 5 seeds: FM 0.6040, AutoInt 0.6041 (+0.0001, a
      tenth of the noise band, and behind on test), DeepFM 0.6032. FFM is worse at
      5.7x the parameters. Capacity is not the bottleneck in a fourth place.
    evidence: {exp_ids: ["7-autoint-bpr-k16-lr0.0002", "7-deepfm-bpr-k16-lr0.0002",
                         "7-ffm-bpr-k16-lr0.0002", "7-fm-bpr-k16-lr0.0002"]}

  - what: "mean-pooled behaviour sequences (the non-attention variant)"
    result: >-
      0.6037 valid against 0.6040 without the sequence — slightly negative. With the
      DIN attention result this closes the axis from both ends: the history carries
      nothing the user_id x video_id cross has not already learned.
    evidence: {exp_ids: ["7-fm-bpr-k16-lr0.0002-seqmean",
                         "7-deepfm-bpr-k16-lr0.0002-seqmean"]}

  - what: "ensembling seeds of the same model family"
    result: >-
      +0.0005 valid at best (20 models, rank-averaged). Seed-averaging inside one
      cell gives ~0.0000 — the members are too correlated to pay. Only the mix that
      included pointwise moved at all, so what little there is comes from diversity,
      not from ensembling per se.
    evidence: {exp_ids: ["6-ensemble-rank-best"]}

  - what: "exposure-based behaviour sequences in a DIN"
    result: "0.6022, below its own no-sequence control at 0.6034, at 11x the cost"
    evidence: {exp_ids: [1I-din-exposure-d16-lr0.003, 1I-din-noseq-d16-lr0.003]}

# ------------------------------------------------------------- dataset facts
# Measured properties worth knowing before proposing anything.
dataset_facts:
  rows: {train: 1141112, valid: 124909, test: 170588}
  users: {train: 26210, valid: 22377, test: 23875}
  label_base_rate: {train: 0.3366, valid: 0.3133, test: 0.3135}
  id_overlap:
    test_users_seen_in_train: 0.967
    test_videos_seen_in_train: 0.998
    implication: >-
      On PURE this is NOT a cold-start problem. Cold-start machinery is wasted
      effort here; the difficulty is behavioural drift on known ids.
    scope_warning: >-
      This is the single most benchmark-specific fact in this file, and it does not
      generalise: on KuaiRand-1K only 15.1% of test videos appear in train, which
      inverts the conclusion and with it the loss recommendation. See
      scale_transfer. Always re-measure this ratio before reusing anything here.
  train_volume_skew: >-
    59% of train rows fall in three days (2022-04-10..12); the eval period runs at
    ~15K rows/day. Training is dominated by an earlier, higher-engagement regime.
  test_user_composition:
    all_negative: 0.271     # nDCG identically 0, unreachable by any model
    all_positive: 0.092     # nDCG identically 1
    discriminative: 0.637   # the only users GAUC scores

# --------------------------------------------------- cheap regularisation
# Phase 1C showed auxiliary heads act as regularisers, not as transfer. Phase 8
# buys that regularisation directly instead.
embedding_noise:
  what: "Gaussian noise added to embeddings during training only (fm.train(emb_noise=s))"
  cost: "one RNG draw per batch; no extra head, task weights or forward pass"
  verdict: RETIRED_by_unbiased_eval    # Phase 11
  retired_why: >-
    Phase 11 scored it on rand_valid (the randomly-exposed log) -- the "genuinely
    held-out third split" the v2 unclaimed_lead below asked for. It LOSES there:
    -0.0014 under pointwise, -0.0064 under BPR. The biased-split gain was fitting
    the exposure policy. Do not add embedding noise.
  under_pointwise:
    v2_verdict: confirmed
    v3_verdict: retired
    effect: "+0.0008 valid, +0.0012 test, but -0.0014 rand_valid (Phase 11)"
  under_bpr:
    v2_verdict: no_gain_on_the_selection_split
    v3_verdict: retired
    effect: "+0.0007 valid, +0.0002 test, -0.0064 rand_valid (Phase 11)"
    unclaimed_lead: >-
      RESOLVED. The v2 note recorded sigma=0.1's test +0.0006 as "a lead for a
      future run with a genuinely held-out third split". rand_valid IS that split
      and it says -0.0064. Bias overfitting, not signal.
  danger_zone: >-
    The cliff is close and steep. Past sigma=0.2 the score collapses, and BPR
    degrades about twice as hard as pointwise (-0.0104 vs -0.0043 at sigma=0.5).
  evidence:
    exp_ids: ["8-pointwise-noise0-seed0", "8-pointwise-noise0.1-seed0",
              "8-pointwise-noise0.5-seed0", "8-bpr-noise0-seed0",
              "8-bpr-noise0.05-seed0", "8-bpr-noise0.1-seed0",
              "8-bpr-noise0.5-seed0",
              "11-pointwise-k16-noise0.1", "11-bpr-k16-noise0.1"]

# --------------------------------------------------------- what this KB buys
# Measured, not assumed (Phase 4). Same loop, same 15-iteration budget, one arm
# proposing blind from KNOWLEDGE_BASE_PLAN.md's own pre-registered space and one
# reading this file. 3 restarts each.
kb_ablation:
  verdict: buys_efficiency_not_ceiling
  results:                                   # mean of 3 restarts
    best_valid:                {blind: 0.6039, with_kb: 0.6042}
    best_valid_worst_restart:  {blind: 0.6032, with_kb: 0.6042}
    iterations_to_beat_baseline: {blind: [3, 3, 14], with_kb: [1, 1, 1]}
    iterations_to_converge:      {blind: [6, 6, 4], with_kb: [4, 4, 4]}
    trials_at_or_below_baseline: {blind: 12.67, with_kb: 0.33, out_of: 15}
    search_wall_clock_s:       {blind: 1938, with_kb: 1083}
  honest_reading: >-
    The KB does NOT find better models. Over 15 iterations, random search across a
    sensible space reaches a comparable score (0.6039 vs 0.6042 — inside the noise
    band). What it removes is waste and variance: 12.67 of 15 wasted trials become
    0.33, iterations-to-beat-baseline goes from a variable 3/3/14 to a flat 1/1/1,
    and search wall-clock falls 44%.
  circularity_caveat: >-
    This KB was derived from this dataset, so it cannot claim to DISCOVER faster
    than blind search. The claim is transfer cost only: what a search pays to reach
    what the KB hands over on iteration 1.
  budget_implication: >-
    Against a 50-iteration / 6h budget, the value is the ~12 iterations per 15 that
    are freed for axes still unexplored — plus never suffering the blind arm's bad
    restart, which spent 14 iterations before first clearing the baseline.
  artifact: ml_modelling/phase4_ablation.json
  reproduce: "python experiments/p4_kb_ablation.py --iterations 15 --restarts 3"

# ---------------------------------------------------------------- kb ensemble
# Phase 16. Extends Phase 6 (which found same-family seed-averaging pays ~0) by
# rank-averaging across DIFFERENT objectives.
kb_ensemble:
  verdict: marginal_but_the_best_single_number
  recommended_combo: [bpr, pointwise, ssm]
  method: "within-user percentile rank average (scale-free); select combo on valid, veto on rand_valid"
  results:                                    # seed 0, one model per member
    bpr_pointwise_ssm: {valid: 0.6042, test: 0.5985, rand_valid: 0.3730}
    bpr_ssm:           {valid: 0.6034, test: 0.5982, rand_valid: 0.3753}
    ssm_alone:         {valid: 0.6036, test: 0.5986, rand_valid: 0.3759}
    all_five:          {valid: 0.6040, test: 0.5981, rand_valid: 0.3685}
  reading: >-
    The 3-way ensemble is the best valid number (+0.0001..0.0003 over the best
    single) and ties SSM on test. Small, exactly Phase 6's finding. Adding the weak
    members (watch-time head, ESMM) HURTS -- the ensemble is 3-way, not 5.
  submission: >-
    submission_alt_{valid,test}.csv (validated with submit.py). test 0.5985 =
    +0.0039 over the official baseline vs BPR's +0.0034. NOT the designated
    submission -- make_submission.py stays on BPR.
  evidence: {exp_ids: ["16-ensemble-bpr+pointwise+ssm"]}
  reproduce: "python experiments/p16_ensemble_final.py --members bpr,pointwise,ssm --write-submission"

# --------------------------------------------------------------- scale transfer
scale_transfer:
  derived_from: kuairand_pure
  status: "validated against KuaiRand-1K; 27K not attempted (see below)"

  headline: >-
    DO NOT APPLY THIS KB TO KUAIRAND-1K. The recommended config LOSES there by
    -0.0152 valid over 3 seeds — roughly 7 standard errors, an order of magnitude
    outside any noise band. 1K is not a bigger Pure; it is a different sampling
    regime, and the difference is in the data's shape, not its volume.

  tier12_note: >-
    The Phase 11-16 findings are Pure-only too. Sampled softmax is a within-user
    ranking loss like BPR, so it inverts on 1K for the same reason (item
    cold-start leaves no within-user ordering signal). The rand_valid bias-veto
    and the four control reversals are METHOD and travel; the numbers do not. If
    attempting 1K/27K, re-derive from pointwise per the directive below.

  why_it_fails:
    fact: >-
      Pure samples 27,077 users over a 7,551-video catalog (190 rows per video,
      99.9% of test videos seen in train). 1K takes 1,000 users' ENTIRE histories
      over the full 4,369,953-video catalog (2.7 rows per video, only 15.1% of test
      videos seen in train).
    consequence: >-
      Pure is a warm-ID ranking problem with temporal drift. 1K is an item
      cold-start problem with no drift (label rate 0.2635 -> 0.2588, essentially
      flat, against Pure's 0.3366 -> 0.3135). BPR's advantage on Pure came from
      spending capacity on within-user ordering rather than the global rate; when
      85% of test items have no learned embedding, there is little ordering signal
      to spend it on and pointwise calibration carries more of the score.

  what_inverted:                   # measured, not predicted
    - claim: "BPR beats pointwise"
      pure: "+0.0021 valid (5 seeds)"
      one_k: "-0.0152 valid (3 seeds), and negative at EVERY lr in [0.0002, 0.02]"
      verdict: inverted
      note: >-
        Swept lr specifically to separate "the loss does not transfer" from "its
        step size does not". All four learning rates lose, so it is the loss.
    - claim: "k is a cost knob, not a scoring knob (flat 1..16)"
      pure: "flat 0.6018-0.6028 across k=1..16"
      one_k: "peaked: k=4 0.6389, k=16 0.6438, k=64 0.6390"
      verdict: inverted
      note: "capacity genuinely matters on 1K; k=16 beats k=4 by 0.005"
    - claim: "single-run noise band 0.0016"
      pure: "valid sd 0.0005"
      one_k: "valid sd 0.0022 (baseline), 4x larger"
      verdict: inverted
      note: "the band must be re-measured per benchmark; Pure's is far too tight for 1K"
    - claim: "typical best epoch ~7"
      pure: "epoch 7"
      one_k: "epoch 2 — overfits far faster"
      verdict: inverted

  what_held:
    - "user-only features contribute 0 — a consequence of within-user ranking, not of scale"
    - "the diagnostics playbook — Adam bounding the step is a property of the optimizer"
    - "decision_protocol.replication_rule — needed MORE at 1K, where seed noise is 4x larger"

  directive: >-
    On any benchmark other than KuaiRand-Pure, treat this file as a method, not as
    a set of values. Run the facts pass FIRST (experiments/p5_scale_transfer.py
    --stage facts): rows per video and the share of eval items unseen in train are
    the two numbers that decide whether anything here applies at all. If items are
    largely cold, start from pointwise at k=16 and re-derive; do not open on the
    recommended config.

  engineering_notes:
    - >-
      The dense Adam update is O(vocab x k) PER BATCH, which is free at Pure's 40K
      vocabulary and infeasible at 1K's 2.9M. Use fm.train(sparse=True). It is lazy
      sparse Adam and therefore an approximation, verified to land inside the noise
      band on Pure (pointwise +0.0007, bpr -0.0000) before being trusted at scale.
    - >-
      Use benchmarks.load_logs(minimal=True) and features.encode_int_fields. The
      full 19-column string-based path peaks at 5.6GB on 1K and will OOM on a 24GB
      machine; the minimal chunked integer path peaks at 0.4GB.

  kuairand_27k:
    attempted: false
    reason: >-
      Not a waiting problem, a design problem. 322M rows x 6 minimal columns is
      ~7GB of parsed arrays on a 23.7GB machine, and a single 40-epoch run is ~7.7
      hours at the measured per-row cost — beyond one 6h benchmark budget for ONE
      config, before any search. It needs out-of-core storage (memmap) plus
      subsample-search-then-final-fit, which is a build rather than a longer run.
    if_attempted: >-
      Run the facts pass first. 27K is sampled like 1K (all interactions for a user
      sample), so expect the 1K regime — item cold-start — not the Pure one, and
      expect the pointwise baseline to be the right starting point.

  onek_tuning_attempts:
    what: >-
      After confirming BPR loses on 1K (above), 1K's OWN pointwise baseline
      (valid 0.6439 +/- 0.0022, test 0.6380 +/- 0.0021, 3 seeds) was tuned
      directly rather than re-testing Pure's recipe: embedding noise, a smaller
      learning rate with a longer budget, k=32 (filling the gap between the
      already-tested k=16/k=64), and (user,author) causal affinity -- retried
      because 1K's (user,author) pairs are 26.5% warm on test vs Pure's dead
      2.6%, so the coverage objection that killed it on Pure does not apply here.
    result: NONE_BEAT_BASELINE
    detail:
      noise_sigma_0.05: {valid: 0.6416, d_valid: -0.0023}
      noise_sigma_0.1:  {valid: 0.6419, d_valid: -0.0020}
      noise_sigma_0.2:  {valid: 0.6418, d_valid: -0.0021}
      lr_0.0005_ep60:   {valid: 0.6439, d_valid: -0.0000, note: "single-run lead of +0.0008 fully evaporated on replication"}
      lr_0.0002_ep60:   {valid: 0.6417, d_valid: -0.0022}
      k32:              {valid: 0.6420, d_valid: -0.0019, note: "closes the capacity bracket: k=16 stays the 1K optimum"}
      user_author_affinity: {valid: 0.6358, d_valid: -0.0081, note: "worse despite 10x the coverage Pure had; coverage alone was not sufficient"}
    caution: >-
      All 3-seed means, all within ~1se of the baseline. This mirrors
      embedding_noise's own history on Pure: a lr-variant showed valid flat /
      test +0.002 here too (lr_0.0005: d_test +0.0022, lr_0.0002: d_test
      +0.0021), the exact valid-flat/test-up shape that turned out to be a
      rand_valid-detectable bias artifact under embedding_noise. 1K DOES have
      its own random-exposure log (log_random_4_22_to_5_08_1k.csv, 1K's data
      dir) but explib/unbiased.py currently only loads Pure's
      (D.load_logs(random_log=True)) -- extending it to 1K is the correct next
      step before trusting either lr delta, not a smaller-lr recommendation.
    evidence:
      exp_ids: [10-1k-pointwise-noise0.05-seed0, 10-1k-pointwise-noise0.05-seed1,
                10-1k-pointwise-noise0.05-seed2, 10-1k-pointwise-noise0.1-seed0,
                10-1k-pointwise-noise0.1-seed1, 10-1k-pointwise-noise0.1-seed2,
                10-1k-pointwise-noise0.2-seed0, 10-1k-pointwise-noise0.2-seed1,
                10-1k-pointwise-noise0.2-seed2,
                "10-1k-pointwise-lr0.0005-ep60-seed0", "10-1k-pointwise-lr0.0005-ep60-seed1",
                "10-1k-pointwise-lr0.0005-ep60-seed2", "10-1k-pointwise-lr0.0002-ep60-seed0",
                "10-1k-pointwise-lr0.0002-ep60-seed1", "10-1k-pointwise-lr0.0002-ep60-seed2",
                10-1k-pointwise-k32-seed0, 10-1k-pointwise-k32-seed1, 10-1k-pointwise-k32-seed2,
                10-1k-pointwise-aff-user_author-seed0]

  onek_extended_axes:
    what: >-
      Phase 18/19: the Tier-1/2 axes never tested on 1K -- SSM loss (Pure's
      confirmed BPR-peer), (user,tab)/(user,dur) causal affinity (smaller-
      cardinality retries of the failed (user,author) test above), and GBDT
      under a genuinely pairwise objective (rank:pairwise / rank:ndcg -- the
      gap flagged as the most-cited open item on BOTH benchmarks, never run
      on either until now). All tested against 1K's own baseline (valid
      0.6439 +/- 0.0022, 3 seeds); the >1 baseline-SE gate (~0.0013) decides
      which single-run leads get replicated.
    result: NONE_BEAT_BASELINE
    detail:
      ssm_loss: {valid: 0.6290, d_valid: -0.0149, note: "confirms tier12_note's prediction -- SSM is a within-user normalising loss like BPR and inverts on 1K the same way, for the same item-cold-start reason"}
      user_tab_affinity: {valid: 0.6422, d_valid: -0.0017, note: "does not clear the gate despite far higher per-(user,tab) coverage than (user,author) had"}
      user_dur_affinity: {valid: 0.6362, d_valid: -0.0077}
      gbdt_xgb_pairwise: {valid: 0.6402, d_valid: -0.0037, note: "rank:pairwise, base+causal-affinity features, single run, did not clear the gate so no replication run"}
      gbdt_xgb_ndcg: {valid_mean: 0.6429, valid_sd: 0.0040, n_seeds: 3, d_valid_mean: -0.0010, note: "single-run lead of +0.0024 (seed0: 0.6463) fully evaporated on 3-seed replication -- the fifth 1K lead this workstream has killed this way"}
      gbdt_catboost_yetirank: {status: NOT_COMPLETED, note: "killed after 90+ min stuck at ~1 of 16 cores with zero completed boosting rounds -- CatBoost's CPU YetiRank pair-generation does not parallelize the way tree-histogram building does, compounded by a script bug (cat_features was never passed to Pool(), so all ID columns were quantized as continuous instead of categorical). Genuinely untested, not a negative result; would need that fix plus PairLogit instead of YetiRank (or far fewer rounds) before it is worth retrying."}
    caution: >-
      user_dur_affinity's test score (0.6392) sits slightly above 1K's
      baseline test mean (0.6380) despite valid being clearly negative
      (-0.0077, not flat) -- noted for completeness, but this is not the
      valid-flat/test-up shape the rand_valid bias veto exists to catch, and
      valid alone already fails the gate. None of these five results reached
      the unbiased-eval step: all either failed the single-run gate outright,
      or (gbdt_xgb_ndcg) failed on replication before qualifying for it.
    engineering_notes:
      - >-
        SSM and both affinity fields required zero new code: fm.py's
        sparse=True path already covers ssm (_step_ssm routes through the
        same apply_grad that dispatches to apply_grad_sparse), and
        features.encode_int_fields/apply_int_fields already covers arbitrary
        int-valued fields as a 6th column, per the (user,author) precedent
        above.
      - >-
        GBDT-on-1K needed a new bench-aware feature builder
        (experiments/p19_1k_gbdt.py) that excludes the `user` block (Pure's
        own KB already shows 0 contribution -- structural, not benchmark-
        specific) and the `vstat` block (3.4GB 1K source, never a winner even
        on Pure).
    evidence:
      exp_ids: [18-1k-ssm-lr0.0003-t1-n8-k16-seed0, 18-1k-pointwise-aff-user_tab-seed0,
                18-1k-pointwise-aff-user_dur-seed0, 19-1k-xgb_pairwise-base+aff,
                19-1k-xgb_ndcg-base+aff, 19-1k-xgb_ndcg-base+aff-seed1,
                19-1k-xgb_ndcg-base+aff-seed2]

  evidence:
    exp_ids: [5-1k-baseline-seed0, 5-1k-baseline-seed1, 5-1k-baseline-seed2,
              5-1k-kbpick-seed0, 5-1k-kbpick-seed1, 5-1k-kbpick-seed2,
              "5-1k-bpr-lr0.001-seed0", "5-1k-bpr-lr0.005-seed0",
              "5-1k-bpr-lr0.02-seed0", 5-1k-pointwise-k4-seed0,
              5-1k-pointwise-k16-seed0, 5-1k-pointwise-k64-seed0]
    facts_files: [phase5_facts_pure.json, phase5_facts_1k.json]
